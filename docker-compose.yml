services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flakeguard
      POSTGRES_PASSWORD: flakeguard
      POSTGRES_DB: flakeguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flakeguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: ["http"]
    environment:
      DATABASE_URL: postgres://flakeguard:flakeguard@postgres:5432/flakeguard?sslmode=disable
      INGEST_API_KEY: ${INGEST_API_KEY:-dev-secret}
      HTTP_ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
